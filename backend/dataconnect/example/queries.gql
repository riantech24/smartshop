mutation CreateUser @auth(level: USER) {
  user_insert(data: { id_expr: "auth.uid", email: "user@example.com", displayName: "User" })
}

mutation UpdateUser($displayName: String!) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { displayName: $displayName })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id email displayName avatarUrl bio
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Publicly listing users is part of the community feature.") {
  users {
    id displayName
  }
}

mutation CreateNote($title: String!, $content: String!) @auth(level: USER) {
  note_insert(data: { title: $title, content: $content, authorId_expr: "auth.uid", createdAt_expr: "request.time" })
}

mutation UpdateNote($id: UUID!, $title: String!) @auth(level: USER) {
  note_update(key: { id: $id }, data: { title: $title })
}

mutation DeleteNote($id: UUID!) @auth(level: USER) {
  note_delete(key: { id: $id })
}

query GetNote($id: UUID!) @auth(level: USER) {
  note(id: $id) {
    title content createdAt author { id }
  }
}

query ListMyNotes @auth(level: USER) {
  notes(where: { authorId: { eq_expr: "auth.uid" } }) {
    id title createdAt
  }
}

mutation CreateTag($name: String!) @auth(level: USER) {
  tag_insert(data: { name: $name })
}

mutation DeleteTag($id: UUID!) @auth(level: USER) {
  tag_delete(key: { id: $id })
}

mutation UpdateTag($id: UUID!, $name: String!) @auth(level: USER) {
  tag_update(key: { id: $id }, data: { name: $name })
}

query GetTag($id: UUID!) @auth(level: USER) {
  tag(id: $id) {
    name
  }
}

query ListTags @auth(level: PUBLIC, insecureReason: "Tags are globally shared metadata.") {
  tags {
    id name
  }
}

mutation CreateWorkspace($name: String!) @auth(level: USER) {
  workspace_insert(data: { name: $name, ownerId_expr: "auth.uid" })
}

mutation UpdateWorkspace($id: UUID!, $name: String!) @auth(level: USER) {
  workspace_update(key: { id: $id }, data: { name: $name })
}

mutation DeleteWorkspace($id: UUID!) @auth(level: USER) {
  workspace_delete(key: { id: $id })
}

query GetWorkspace($id: UUID!) @auth(level: USER) {
  workspace(id: $id) {
    name owner { id }
  }
}

query ListMyWorkspaces @auth(level: USER) {
  workspaces(where: { ownerId: { eq_expr: "auth.uid" } }) {
    id name
  }
}